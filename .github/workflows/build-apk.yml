name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cai Capacitor
        run: npm install

      - name: Tao du an Android
        run: npx cap add android

      - name: Thay icon app
        run: |
          cp -r resources/android/* android/app/src/main/res/
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#12100E</color>
          </resources>
          XML

      - name: Dong bo web vao Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: que-kinh-dich-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
